# Legacy App Engine template; not the Render deployment configuration.
# Secrets must be supplied through the hosting secret store, never this file.
runtime: nodejs22
entrypoint: npm start
env_variables:
  NODE_ENV: production
  PORT: '8080'
  ADMIN_ALLOWED_ORIGINS: https://miniapp.tumorong.com
# MONGODB_URI and SESSION_SECRET are required before startup.
# Set TRUST_PROXY_HOPS for the actual proxy chain when using another host.
